name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The API tests use fake runners, so the heavy model packages are not needed here.
      - run: pip install fastapi httpx pytest pydantic
      - run: python -m pytest -q backend/tests
      - name: Page builds from the saved data
        run: python backend/refresh.py --build-only
