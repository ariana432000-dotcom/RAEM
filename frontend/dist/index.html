<!doctype html>
<html lang="en">
<head>

<title>RAEM Forecast Console</title>

<style>
/* Layout: sticky glass top nav, then one centred column (hero, glass cards, footer) over a soft gradient field.
   Palette: periwinkle accent on a pale lilac and mint field (light) or deep navy with violet and teal glows (dark).
   Green, red and amber are signal colours only. Manrope for text, JetBrains Mono for every figure. */
:root {
  --bg: #f3f4f9; --solid: #ffffff; --bg-raised: #ffffffa6; --panel: #ffffffb8; --panel-hover: #ffffffe6;
  --border: #505aa029; --border-soft: #505aa01a; --ctl: #7d88b0;
  --text: #141a33; --muted: #4d5880; --faint: #5c6689;
  --accent: #4350f0; --accent2: #8a4ff0; --accent-soft: #4350f01a; --accent-strong: #2f3ac4; --on-accent: #ffffff;
  --buy: #0a6f43; --buy-soft: #0a6f431a; --sell: #c4254f; --sell-soft: #c4254f1a; --hold: #8a5304; --hold-soft: #8a53041a;
  --c1: #d4561f; --c2: #0a8f8a; --c3: #8a4fd0; --c4: #8f7400; --c5: #d6409f; --c6: #3f8f2a; --c7: #2a7fd4; --c8: #7a5c44;
  --base-line: #b2badb; --shadow: 0 10px 34px rgba(60, 70, 140, 0.12);
  --g1: #dde3ff; --g2: #ebe2ff; --g3: #dcf3ec; --g4: #fdeee4;
  --font-sans: "Manrope", ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0e1f; --solid: #171c33; --bg-raised: #ffffff12; --panel: #ffffff0f; --panel-hover: #ffffff1c;
    --border: #ffffff22; --border-soft: #ffffff14; --ctl: #7480ad;
    --text: #eef0ff; --muted: #b0b8da; --faint: #a0a9cf;
    --accent: #8b97ff; --accent2: #c08bff; --accent-soft: #8b97ff26; --accent-strong: #aab3ff; --on-accent: #0a0e1f;
    --buy: #3ddc97; --buy-soft: #3ddc9726; --sell: #ff8aa0; --sell-soft: #ff8aa026; --hold: #fbbf24; --hold-soft: #fbbf2426;
    --c1: #ff8a57; --c2: #3fd0c9; --c3: #b88cf2; --c4: #e6c23a; --c5: #f276c3; --c6: #7ad45f; --c7: #62aef5; --c8: #c9a589;
    --base-line: #3b4468; --shadow: 0 10px 34px rgba(0, 0, 0, 0.4);
    --g1: #151a42; --g2: #1d1742; --g3: #0c2531; --g4: #101c46; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0e1f; --solid: #171c33; --bg-raised: #ffffff12; --panel: #ffffff0f; --panel-hover: #ffffff1c;
  --border: #ffffff22; --border-soft: #ffffff14; --ctl: #7480ad;
  --text: #eef0ff; --muted: #b0b8da; --faint: #a0a9cf;
  --accent: #8b97ff; --accent2: #c08bff; --accent-soft: #8b97ff26; --accent-strong: #aab3ff; --on-accent: #0a0e1f;
  --buy: #3ddc97; --buy-soft: #3ddc9726; --sell: #ff8aa0; --sell-soft: #ff8aa026; --hold: #fbbf24; --hold-soft: #fbbf2426;
  --c1: #ff8a57; --c2: #3fd0c9; --c3: #b88cf2; --c4: #e6c23a; --c5: #f276c3; --c6: #7ad45f; --c7: #62aef5; --c8: #c9a589;
  --base-line: #3b4468; --shadow: 0 10px 34px rgba(0, 0, 0, 0.4);
  --g1: #151a42; --g2: #1d1742; --g3: #0c2531; --g4: #101c46; color-scheme: dark;
}
* { box-sizing: border-box; border-color: var(--border); }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
::selection { background: var(--accent); color: #fff; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.up { color: var(--buy); } .down { color: var(--sell); } .flat { color: var(--muted); }

/* shell */
.bgfx { position: fixed; inset: 0; z-index: -1; background: radial-gradient(55% 45% at 10% 6%, var(--g1), transparent 62%), radial-gradient(45% 40% at 92% 10%, var(--g2), transparent 62%), radial-gradient(50% 45% at 78% 96%, var(--g3), transparent 62%), radial-gradient(40% 40% at 4% 88%, var(--g4), transparent 62%), var(--bg); }
.app { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
.topnav { flex: none; position: relative; z-index: 30; background: var(--panel); backdrop-filter: blur(18px) saturate(150%); -webkit-backdrop-filter: blur(18px) saturate(150%); border-bottom: 1px solid var(--border); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topnav-in { max-width: 1180px; margin-inline: auto; height: 64px; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 0; font-weight: 800; font-size: 17px; letter-spacing: -0.01em; white-space: nowrap; flex: none; }
.logo { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-weight: 700; font-size: 13px; flex: none; }
.links { display: flex; gap: 2px; align-items: center; margin-left: 10px; min-width: 0; }
.nl { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--muted); white-space: nowrap; transition: background 0.15s, color 0.15s; }
.nl:hover { color: var(--text); background: var(--panel-hover); }
.nl[aria-current] { background: var(--accent-soft); color: var(--accent-strong); }
.nl svg { width: 16px; height: 16px; flex: none; }
.morewrap { position: relative; }
.pop { position: absolute; top: calc(100% + 10px); right: 0; min-width: 230px; background: var(--solid); border: 1px solid var(--border); border-radius: 18px; padding: 8px; box-shadow: var(--shadow); z-index: 40; display: flex; flex-direction: column; gap: 2px; }
.pop .nl { width: 100%; border-radius: 12px; }
.search { position: relative; flex: 0 1 230px; margin-left: auto; }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--faint); pointer-events: none; }
.search input { width: 100%; height: 38px; border-radius: 999px; border: 1px solid var(--ctl); background: var(--bg-raised); padding: 0 14px 0 38px; font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
.search input::placeholder { color: var(--faint); text-transform: none; letter-spacing: 0; }
.search input:focus { border-color: var(--accent); outline: none; }
.search .miss { position: absolute; top: 44px; left: 0; font-size: 11px; color: var(--sell); background: var(--solid); border: 1px solid var(--border); padding: 4px 10px; border-radius: 10px; z-index: 5; white-space: nowrap; }
.iconbtn { width: 36px; height: 36px; border-radius: 999px; border: 0; background: none; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.iconbtn:hover { background: var(--panel-hover); color: var(--text); }
.iconbtn svg { width: 18px; height: 18px; }
.menu { display: none; }
.dotc { width: 8px; height: 8px; border-radius: 50%; background: var(--buy); flex: none; display: inline-block; }
.dotc.warn { background: var(--hold); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
.scrollarea { flex: 1; overflow-y: auto; min-height: 0; }
.content { max-width: 1180px; margin-inline: auto; padding-block: 36px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 28px; }
.footer { max-width: 1180px; margin-inline: auto; padding-block: 8px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); color: var(--faint); font-size: 12px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; align-items: center; }
.footer .l { display: inline-flex; gap: 8px; align-items: center; }
.sheet { display: none; position: fixed; z-index: 25; inset: 0; padding: calc(76px + env(safe-area-inset-top, 0px)) 16px 28px; background: var(--solid); overflow-y: auto; }
.app.open .sheet { display: block; }
.sheet .nl { width: 100%; padding: 12px 14px; border-radius: 14px; font-size: 15px; }
.navh { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--faint); padding: 18px 14px 6px; }
.sheet .dot { margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: var(--border); flex: none; }
.sheet .dot.BUY { background: var(--buy); } .sheet .dot.SELL { background: var(--sell); } .sheet .dot.HOLD { background: var(--hold); }
.sheet .sym { font-family: var(--font-mono); font-size: 13px; }
.sheet .nm { font-size: 12px; color: var(--faint); }
.backdrop { display: none; }
.skip { position: absolute; left: -999px; top: 0; z-index: 100; background: var(--accent); color: var(--on-accent); padding: 8px 14px; border-radius: 0 0 12px 0; font-weight: 700; }
.skip:focus { left: 0; }
tr.click:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.tabpanel:focus-visible { outline-offset: 4px; }
.formgrid[hidden] + .runbar { margin-top: 0; padding-top: 0; border-top: 0; }
@media (pointer: coarse) { .pillbtn, .tab, .btn.sm, .nl, select, .search input { min-height: 44px; } .x, .iconbtn { min-width: 44px; min-height: 44px; } }
@media (max-width: 860px) { .links { display: none; } .menu { display: inline-flex; } .search { flex: 1 1 auto; } .brand span:last-child { display: none; } }

/* primitives */
.page-h h1 { font-size: clamp(28px, 3.6vw, 40px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
.page-h p { margin-top: 8px; font-size: 15px; color: var(--muted); max-width: 70ch; }
.card { border: 1px solid var(--border); background: var(--panel); border-radius: 22px; padding: 24px; min-width: 0; box-shadow: var(--shadow); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); }
.card.warn { border-color: color-mix(in srgb, var(--hold) 30%, transparent); background: var(--hold-soft); }
.card.dashed { border-style: dashed; background: transparent; }
.ch { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
.ch h3 { font-size: 16px; font-weight: 700; letter-spacing: -0.005em; }
.ch p { margin-top: 4px; font-size: 12px; color: var(--muted); }
.src { margin-top: 14px; font-size: 11px; color: var(--faint); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.stat .k { font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.stat .v { margin-top: 8px; font-family: var(--font-mono); font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat .h { margin-top: 4px; font-size: 12px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stat .ico { width: 40px; height: 40px; border-radius: 13px; background: var(--bg-raised); color: var(--muted); display: flex; align-items: center; justify-content: center; flex: none; }
.stat .ico svg { width: 16px; height: 16px; }
.stat .v.buy { color: var(--buy); } .stat .v.sell { color: var(--sell); } .stat .v.hold { color: var(--hold); } .stat .v.accent { color: var(--accent-strong); }
.badge { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg-raised); color: var(--muted); padding: 2px 10px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.badge.buy { background: var(--buy-soft); color: var(--buy); border-color: color-mix(in srgb, var(--buy) 30%, transparent); }
.badge.sell { background: var(--sell-soft); color: var(--sell); border-color: color-mix(in srgb, var(--sell) 30%, transparent); }
.badge.hold { background: var(--hold-soft); color: var(--hold); border-color: color-mix(in srgb, var(--hold) 30%, transparent); }
.badge.accent { background: var(--accent-soft); color: var(--accent-strong); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
.badge.sig { font-family: var(--font-mono); text-transform: uppercase; }
.badge.sig i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; display: inline-block; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 22px; border-radius: 999px; border: 1px solid transparent; font-size: 14px; font-weight: 700; transition: background 0.15s, filter 0.15s; }
.btn.primary { background: var(--accent); color: var(--on-accent); box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 24%, transparent); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.secondary { background: var(--bg-raised); border-color: var(--ctl); }
.btn.secondary:hover { background: var(--panel-hover); }
.btn.sm { height: 34px; padding: 0 14px; font-size: 12px; gap: 6px; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; font-size: 12px; font-weight: 600; color: var(--accent-strong); }
.link:hover { text-decoration: underline; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pillbtn { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg-raised); color: var(--faint); padding: 6px 12px; font-size: 12px; font-weight: 500; }
.pillbtn:hover { color: var(--muted); }
.pillbtn i { width: 6px; height: 6px; border-radius: 50%; background: var(--base-line); display: inline-block; }
.pillbtn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); }
.pillbtn[aria-pressed="true"] i { background: var(--accent); }
.pillbtn.mdl[aria-pressed="true"] { border-color: var(--border); background: var(--bg-raised); color: var(--text); }
.pillbtn.mdl { padding: 4px 10px; }
.field label, .field .lbl { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--faint); margin-bottom: 8px; }
.field .lbl .link { text-transform: none; letter-spacing: 0; margin-left: 8px; }
select { height: 38px; border-radius: 12px; border: 1px solid var(--ctl); background: var(--bg-raised); padding: 0 10px; min-width: 190px; max-width: 100%; }
.checks { display: flex; flex-direction: column; gap: 8px; }
.checks label { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); text-transform: none; letter-spacing: 0; margin: 0; cursor: pointer; }
.checks input { accent-color: var(--accent); }
.formgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px 28px; }
.runbar { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--border-soft); }
.runbar .note { flex: 1 1 260px; font-size: 12px; color: var(--muted); }

.tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 5px; border-radius: 999px; background: var(--bg-raised); border: 1px solid var(--border); width: fit-content; max-width: 100%; }
.tab { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); padding: 8px 16px; font-size: 13px; font-weight: 600; }
.tab:hover { background: var(--panel-hover); color: var(--text); }
.tab b { font-family: var(--font-mono); font-size: 11px; color: var(--accent-strong); font-weight: 600; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }
.tab[aria-selected="true"] b { color: inherit; opacity: 0.85; }
.tabpanel { margin-top: 18px; display: flex; flex-direction: column; gap: 16px; }

.progress .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.progress .ttl { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; }
.bar { height: 6px; border-radius: 999px; background: var(--bg-raised); overflow: hidden; margin-bottom: 14px; }
.bar > div { height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.3s; }
.progress .msg { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
.progress .msg b { color: var(--text); font-weight: 500; }
.events { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; max-height: 224px; overflow-y: auto; }
.events li { display: flex; gap: 8px; font-size: 11px; color: var(--faint); }
.events li span:last-child { color: var(--muted); }

.empty { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 48px 16px; }
.empty .ic { width: 44px; height: 44px; border-radius: 50%; background: var(--bg-raised); color: var(--faint); display: flex; align-items: center; justify-content: center; margin-bottom: 4px; }
.empty .ic svg { width: 20px; height: 20px; }
.empty .tt { font-size: 14px; font-weight: 500; }
.empty .dd { max-width: 380px; font-size: 12px; color: var(--muted); }

.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
.sigrow { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.ring { position: relative; flex: none; }
.ring svg { transform: rotate(-90deg); display: block; }
.ring .c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring .c b { font-family: var(--font-mono); font-size: 16px; font-weight: 700; }
.ring .c span { font-size: 9px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--faint); }
.sigtext { flex: 1 1 240px; min-width: 0; }
.sigtext .conf { font-family: var(--font-mono); font-size: 12px; color: var(--faint); margin-bottom: 6px; }
.sigtext .sum { font-size: 14px; line-height: 1.6; }
.sect { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border-soft); }
.sect .l { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--faint); margin-bottom: 8px; }
.sect .v { font-family: var(--font-mono); font-size: 14px; font-weight: 500; }
.sect .vs { font-family: var(--font-mono); font-size: 11px; opacity: 0.85; }
.sect .small { margin-top: 8px; font-size: 11px; color: var(--faint); }
.sect .why { font-size: 14px; line-height: 1.6; color: var(--muted); }
.zones { margin-top: 16px; }
.gtrack { position: relative; height: 10px; border-radius: 5px; overflow: hidden; display: flex; }
.gtrack b { display: block; height: 100%; }
.gz-s { background: var(--sell-soft); } .gz-h { background: var(--hold-soft); } .gz-b { background: var(--buy-soft); }
.gmark { position: absolute; top: 0; width: 3px; height: 10px; background: var(--text); transform: translateX(-1px); }
.glabels { position: relative; height: 18px; margin-top: 4px; font-size: 11px; color: var(--faint); font-family: var(--font-mono); }
.glabels span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.rows { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
.row { display: grid; grid-template-columns: 76px minmax(0, 1fr) 136px; gap: 10px; align-items: center; font-size: 13px; }
.row .dv { position: relative; height: 12px; background: var(--bg-raised); border-radius: 3px; }
.row .dv::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--faint); }
.row .dv b { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
.row .dv b.pos { background: var(--buy); } .row .dv b.neg { background: var(--sell); }
.row .val { font-family: var(--font-mono); font-size: 12px; text-align: right; white-space: nowrap; }
.hz { display: grid; grid-template-columns: 44px minmax(0, 1fr) 96px; gap: 10px; align-items: center; font-size: 12px; }
.hz .tr { position: relative; height: 10px; background: var(--bg-raised); border-radius: 3px; }
.hz .tr b { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 3px; }
.hz .tr u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); }

  if (F && S.naive) s += `<line x1="${x(hn - 1)}" x2="${xEnd}" y1="${y(tr(last, last))}" y2="${y(tr(last, last))}" stroke="var(--faint)" stroke-dasharray="5 4"/>`;
  const path = (vals, color, w, op = 1) => `<polyline points="${[[hn - 1, last], ...vals.map((v, i) => [hn + i, v])].map(p => `${x(p[0]).toFixed(1)},${y(tr(p[1], last)).toFixed(1)}`).join(" ")}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" opacity="${op}"/>`;
  drawBase.forEach(m => { s += path(f.paths[m], "var(--base-line)", 1, 0.9); });
  ov.forEach((m, k) => { s += path(f.paths[m], `var(${COLORS[k % COLORS.length]})`, 1.8); });
  if (F) {
    s += path(ms.vals, "var(--text)", 2.8);
    const ey = y(tr(ms.vals[6], last));
    s += `<circle cx="${xEnd}" cy="${ey}" r="4.5" fill="var(--text)" stroke="var(--solid)" stroke-width="2"/><text class="ax" x="${xEnd + 8}" y="${ey + 3}" style="fill:var(--text)">${trFmt(tr(ms.vals[6], last))}</text>`;
  } else {
    const ex = x(hn - 1), ey = y(hv[hn - 1]);
    s += `<circle cx="${ex}" cy="${ey}" r="4" fill="var(--accent)" stroke="var(--solid)" stroke-width="2"/><text class="ax" x="${ex + 8}" y="${ey + 3}" style="fill:var(--text)">${trFmt(hv[hn - 1])}</text>`;
  }
  s += `<line id="xh" x1="0" x2="0" y1="${padT}" y2="${H - padB}" stroke="var(--faint)" opacity="0"/><rect id="hit" x="${padL}" y="${padT}" width="${plotW}" height="${H - padT - padB}" fill="transparent"/></svg>`;
  host.innerHTML = s + `<div class="tip" hidden></div>`;
  const svg = host.querySelector("svg"), tip = host.querySelector(".tip"), xh = host.querySelector("#xh"), hit = host.querySelector("#hit");
  const move = ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;
    let i = 0, bd = 1e9; for (let j = 0; j < total; j++) { const dd = Math.abs(x(j) - px); if (dd < bd) { bd = dd; i = j; } }
    xh.setAttribute("x1", x(i)); xh.setAttribute("x2", x(i)); xh.setAttribute("opacity", "0.6");
    let rows = "";
    if (i < hn) rows += `<div class="r"><span>Close</span><span>${trFmt(hv[i])}</span></div>`;
    else {
      const fi = i - hn;
      rows += `<div class="r"><span>${esc(ms.name)}</span><span>${trFmt(mv[fi])}</span></div>`;
      if (showBand) rows += `<div class="r"><span>10–90% band</span><span>${trFmt(tr(ms.band[fi][0], last))} – ${trFmt(tr(ms.band[fi][1], last))}</span></div>`;
      ov.forEach((m, k) => { rows += `<div class="r" style="color:var(${COLORS[k % COLORS.length]})"><span>${esc(m)}</span><span>${trFmt(tr(f.paths[m][fi], last))}</span></div>`; });
    }
    tip.innerHTML = `<div class="d">${dLong(dates[i])}${i >= hn ? ` · day ${i - hn + 1}` : ""}</div>${rows}`;
    tip.hidden = false;
    tip.style.left = Math.min(r.width - tip.offsetWidth - 4, Math.max(4, x(i) * r.width / W + 12)) + "px"; tip.style.top = "8px";
  };
  hit.addEventListener("pointermove", move); hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", () => { tip.hidden = true; xh.setAttribute("opacity", "0"); });
  const lg = [`<span><i style="background:var(--accent)"></i>Close</span>`];
  if (F) lg.push(`<span><i style="background:var(--text)"></i>${esc(ms.name)}</span>`);
  ov.forEach((m, k) => lg.push(`<span><i style="background:var(${COLORS[k % COLORS.length]})"></i>${esc(m)}</span>`));
  if (drawBase.length) lg.push(`<span><i style="background:var(--base-line)"></i>other base models (${drawBase.length})</span>`);
  if (showBand) lg.push(`<span><i style="background:var(--text);opacity:.25;height:8px"></i>10–90% band</span>`);
  if (F && S.naive) lg.push(`<span><i style="background:var(--faint)"></i>no change</span>`);
  $("#legend").innerHTML = lg.join("");
}

/* ----- generic line chart ----- */
function lineChart(host, labels, series, opts = {}) {
  const W = Math.max(300, host.clientWidth || 700), H = 280, padL = 52, padR = 16, padT = 12, padB = 24;
  const all = series.flatMap(s => s.v).concat(opts.band ? [...opts.band.lo, ...opts.band.hi] : []).filter(v => v != null), lo0 = Math.min(...all), hi0 = Math.max(...all), pad = (hi0 - lo0) * 0.08 || 0.05;
  const lo = lo0 - pad, hi = hi0 + pad, n = labels.length;
  const x = i => padL + i * (W - padL - padR) / Math.max(1, n - 1), y = v => padT + (hi - v) * (H - padT - padB) / (hi - lo);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || "chart")}">`;
  niceTicks(lo, hi, 5).filter(v => v >= lo && v <= hi).forEach(v => { s += `<line x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border-soft)"/><text class="ax" x="${padL - 8}" y="${y(v) + 3}" text-anchor="end">${opts.fmt ? opts.fmt(v) : v.toFixed(2)}</text>`; });
  if (opts.base != null && opts.base > lo && opts.base < hi) s += `<line x1="${padL}" x2="${W - padR}" y1="${y(opts.base)}" y2="${y(opts.base)}" stroke="var(--faint)" stroke-dasharray="4 4"/>`;
  [0, Math.floor((n - 1) / 2), n - 1].forEach((i, k) => { s += `<text class="ax" x="${x(i)}" y="${H - 6}" text-anchor="${k === 0 ? "start" : k === 2 ? "end" : "middle"}">${esc(opts.lab ? opts.lab(labels[i]) : dShort(labels[i]))}</text>`; });
  if (opts.band) {
    const ix = opts.band.lo.map((v, i) => (v != null && opts.band.hi[i] != null) ? i : -1).filter(i => i >= 0);
    if (ix.length) { const first = ix[0] > 0 ? ix[0] - 1 : ix[0], pts = [...(first < ix[0] ? [first] : []), ...ix], bandLo = i => (opts.band.lo[i] != null ? opts.band.lo[i] : series[1].v[i]), bandHi = i => (opts.band.hi[i] != null ? opts.band.hi[i] : series[1].v[i]);
      s += `<polygon points="${pts.map(i => `${x(i).toFixed(1)},${y(bandHi(i)).toFixed(1)}`).join(" ")} ${pts.slice().reverse().map(i => `${x(i).toFixed(1)},${y(bandLo(i)).toFixed(1)}`).join(" ")}" fill="var(--text)" opacity="0.12"/>`; }
  }
  series.forEach(se => {
    if (se.noline) return;
    let run = [];
    const flush = () => { if (run.length > 1) s += `<polyline points="${run.join(" ")}" fill="none" stroke="${se.color}" stroke-width="${se.w || 2}" ${se.dash ? 'stroke-dasharray="5 4"' : ""} stroke-linejoin="round"/>`; run = []; };
    se.v.forEach((v, i) => { if (v == null) flush(); else run.push(`${x(i).toFixed(1)},${y(v).toFixed(1)}`); });
    flush();
  });
  s += `<line id="lxh" x1="0" x2="0" y1="${padT}" y2="${H - padB}" stroke="var(--faint)" opacity="0"/><rect id="lhit" x="${padL}" y="${padT}" width="${W - padL - padR}" height="${H - padT - padB}" fill="transparent"/></svg><div class="tip" hidden></div>`;
  host.innerHTML = s;
  const svg = host.querySelector("svg"), tip = host.querySelector(".tip"), xh = host.querySelector("#lxh"), hit = host.querySelector("#lhit");
  const mv = ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width, i = Math.max(0, Math.min(n - 1, Math.round((px - padL) / ((W - padL - padR) / Math.max(1, n - 1)))));
    xh.setAttribute("x1", x(i)); xh.setAttribute("x2", x(i)); xh.setAttribute("opacity", "0.6");
    tip.innerHTML = `<div class="d">${opts.lab ? opts.lab(labels[i]) : dLong(labels[i])}</div>${series.filter(se => se.v[i] != null).map(se => `<div class="r" style="color:${se.color}"><span>${esc(se.name)}</span><span>${opts.fmt ? opts.fmt(se.v[i]) : se.v[i].toFixed(2)}</span></div>`).join("")}`;
    tip.hidden = false; tip.style.left = Math.min(r.width - tip.offsetWidth - 4, Math.max(4, x(i) * r.width / W + 12)) + "px"; tip.style.top = "8px";
  };
  hit.addEventListener("pointermove", mv); hit.addEventListener("pointerdown", mv);
  hit.addEventListener("pointerleave", () => { tip.hidden = true; xh.setAttribute("opacity", "0"); });
}

function invFc(t, src) {
  const d = DATA[t], f = d.forecast, last = f.last_price, band = fcBand(t);
  let path;

  else if (src === "Agent" && d.agent && d.agent.plan && d.agent.plan.path_ret) path = d.agent.plan.path_ret.map(r => last * (1 + r));
  else if (src === "Daily") { const r = d.daily.final_expected_return; path = Array.from({ length: 7 }, (_, i) => last * (1 + r * (i + 1) / 7)); }
  else path = f.paths[src] || f.paths.Ensemble;

  return { last, path, end: path[6], lo: hb ? band[6][0] : null, hi: hb ? band[6][1] : null };
}
const invAmt = () => Math.max(0, +X.inv.amt || 0);
const invShow = (t, v) => X.inv.basis === "usd" ? "$" + v.toFixed(2) : v.toFixed(2) + " " + DATA[t].meta.currency;

function sessOutcome(t, s) {
  const rows = rowsOf(t), lastDate = rows[rows.length - 1][0], e = closeOn(t, s.date);
  const rating = String(s.rating || (s.signal && s.signal !== "nan" ? s.signal : "")).toUpperCase();
  if (!e || !["BUY", "SELL", "HOLD", "OVERWEIGHT", "UNDERWEIGHT"].includes(rating)) return null;
  const tg = new Date(s.date + "T00:00:00Z"); tg.setUTCDate(tg.getUTCDate() + 7); const td = tg.toISOString().slice(0, 10);
  if (td > lastDate) return { rating, entry: e.px, pending: true };

  return { rating, entry: e.px, exit: x.px, r: x.px / e.px - 1, pending: false };
}
const followFactor = (rating, r) => (rating === "BUY" || rating === "OVERWEIGHT") ? 1 + r : (rating === "SELL" || rating === "UNDERWEIGHT") ? 1 - r : 1;
function invTrack(t) {
  const a = EXTRA.ai[t]; if (!a) return null;
  const list = a.sessions.map(s => ({ s, o: sessOutcome(t, s) })).filter(x => x.o);
  const done = list.filter(x => !x.o.pending), trades = done.filter(x => x.o.rating !== "HOLD");
  const hits = trades.filter(x => followFactor(x.o.rating, x.o.r) > 1).length;
  const avgFollow = trades.length ? trades.reduce((q, x) => q + followFactor(x.o.rating, x.o.r) - 1, 0) / trades.length : null;
  const holds = done.filter(x => x.o.rating === "HOLD");

/* ----- AI influence: the notebook's latest rating tilts the model forecast a little ----- */
// adjusted 7-day move = (1 - w) * model move + w * AI view, where the AI view is the rating (Buy +1 ... Sell -1) times the stock's
// typical 7-day move. w is 20%, or 10-35% from the AI's own graded calls once it has 5; a session over 10 days older than
// the prices has no weight.
const AI_VIEW = { BUY: 1, OVERWEIGHT: 0.5, HOLD: 0, UNDERWEIGHT: -0.5, SELL: -1 };

  const cl = DATA[t].history.slice(-125).map(h => h[1]), m = [];
  for (let i = 0; i + 5 < cl.length; i++) m.push(Math.abs(cl[i + 5] / cl[i] - 1));
  m.sort((a, b) => a - b);
  return m.length ? m[Math.floor(m.length / 2)] : 0.02;
}

  const code = L && String(L.rating || "").toUpperCase(), sig = L && L.signal;
  if (!p || !L || !(code in AI_VIEW || sig in AI_VIEW)) return null;
  // the final decision counts: the rating's shade (Overweight +½) only while it agrees with it (the verifier can override)
  const useSig = sig in AI_VIEW && SIGNAL_OF[code] !== sig, score = useSig ? AI_VIEW[sig] : AI_VIEW[code];
  const last = d.forecast.last_price, base = p[6] / last - 1, info = { rating: useSig ? sig[0] + sig.slice(1).toLowerCase() : L.rating, date: L.date, model: L.llm_model, base, last };
  if (daysBetween(L.date, d.forecast.last_date) > 10) return Object.assign(info, { stale: true, w: 0, adj: base, price: p[6], path: p });

async function pollRun(id, key, onDone) {
  LIVE.busy[key] = { id, status: "queued", step: "", log: [], t0: Date.now() };
  for (;;) {
    let r;
    try {
      r = await api("jobs/" + id);
    } catch (e) {
      await sleep(4000);
      continue;  // a server restart or a network blip: keep asking
    }
    Object.assign(LIVE.busy[key], { status: r.status, step: r.step || "", log: r.log || [], ahead: r.ahead || 0 });
    if (r.elapsed != null) LIVE.busy[key].t0 = Date.now() - r.elapsed * 1000;  // the server's clock, right after a reload too
    if (key.startsWith("ai:") && r.status === "running" && (LIVE.busy[key].n = (LIVE.busy[key].n || 0) + 1) % 2 === 1) {
      try {  // the agents' outputs so far: the notebook saves its log after every agent
        const lv = await api(`runs/${id}/live`);
        if (lv.entry && LIVE.busy[key]) LIVE.busy[key].entry = lv.entry;
      } catch (e) { /* asked again on the next poll */ }
    }
    const el = document.getElementById("live-" + liveId(key));
    if (el) el.innerHTML = liveStatus(key);
    if (r.status === "done") {
      const full = await api("runs/" + id);
      delete LIVE.busy[key];
      onDone(full);
      return;
    }
    if (r.status === "failed" || r.status === "held") {
      delete LIVE.busy[key];
      if (r.status === "failed") LIVE.err[key] = (r.error || "The run failed.") + " " + ((r.log || []).filter(l => l.startsWith("!!")).slice(-3).join(" "));
      LIVE.hist[r.ticker] = undefined;  // the stored-runs table shows the held or failed run
      render();
      return;
    }
    await sleep(2500);
  }
}
function liveStatus(key) {

  const pct = m ? Math.round(+m[1] / +m[2] * 100) : null;
  const lines = (j.log || []).filter(l => l.startsWith("== ") || l.startsWith("!!")).slice(-6).reverse();
  const mins = Math.floor((Date.now() - j.t0) / 60000), secs = Math.floor((Date.now() - j.t0) / 1000) % 60;
  return `<section class="card progress" style="margin-top:14px;box-shadow:none"><div class="top"><div class="ttl"><span class="dotc warn"></span>${j.status === "queued" ? `Waiting in the server queue${j.ahead ? ` (${j.ahead} ahead)` : ""}` : j.holding ? "Holding…" : "Running on the server"}</div><span class="mono" style="font-size:12px;color:var(--muted)">${mins}:${String(secs).padStart(2, "0")}${pct != null ? ` · ${pct}%` : ""}</span></div>
    ${pct != null ? `<div class="bar"><div style="width:${pct}%"></div></div>` : ""}
    <p class="msg" role="status"><b>${esc(m ? m[3] : (j.step || "Starting"))}</b>${m ? ` · step ${m[1]} of ${m[2]}` : ""}</p>
    ${key.startsWith("ai:") && j.status === "running" ? agentBoard(j) : `<ol class="events">${lines.map(l => `<li><span>${esc(l.replace(/^== /, ""))}</span></li>`).join("")}</ol>`}</section>`;
}
// The notebook's agents in run order (sessions.STEP_LABELS); a notebook's own extra steps are added where they appear
const AGENT_STAGES = ["Fundamentals", "Market", "Macro regime", "News", "Sentiment", "Graph analyst", "Forecasting agent", "Bull vs bear debate",
  "Debate facilitator", "Post-mortem", "Trader", "Risk debate", "Risk facilitator", "Portfolio manager", "Prediction engine", "7-day forecast",
  "Verifier", "Position sizing", "10-day scenario"];
function agentBoard(j) {

  if (b.dataset.pick) { const all = BASE.filter(m => D().forecast.paths[m]); S.overlays = b.dataset.pick === "all" ? new Set(all) : b.dataset.pick === "none" ? new Set() : defaultOverlays(D()); render(); return; }
  if (b.dataset.sort) { S.sort = { k: b.dataset.sort, dir: S.sort.k === b.dataset.sort ? -S.sort.dir : (b.dataset.sort === "model" ? 1 : -1) }; render(); return; }
  if (b.dataset.tab) { S.tab = b.dataset.tab; render(); return; }
});
$("#backdrop").addEventListener("click", () => $("#app").classList.remove("open"));
document.addEventListener("change", e => {
  const id = e.target.id;
  if (id === "win") S.win = +e.target.value; else if (id === "unit") S.unit = e.target.value;
  else if (id === "o-base") S.base = e.target.checked; else if (id === "o-band") S.band = e.target.checked; else if (id === "o-naive") S.naive = e.target.checked;
  else return;
  render();
});
$("#search").addEventListener("submit", e => {
  e.preventDefault();
  const q = $("#q").value.trim().toUpperCase(), miss = $("#miss");
  if (!q) return;
  const hit = ORDER.find(t => t === q) || ORDER.find(t => t.startsWith(q) || DATA[t].meta.name.toUpperCase().includes(q));
  if (hit) { miss.hidden = true; $("#q").value = ""; openTicker(hit); }
  else { miss.textContent = `No ${q} in this export. Available: ${ORDER.join(", ")}`; miss.hidden = false; }
});
$("#q").addEventListener("input", () => { $("#miss").hidden = true; });
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act],[data-ai],[data-stage],[data-bt],[data-ds],[data-news],[data-mem],[data-set-theme],[data-set-view],[data-inv-t],[data-inv-src],[data-home]");
  if (!el || el.disabled) return;
  const d = el.dataset, a = d.act, v = d.v;
  if (d.ai) { if (X.ai.running) return; X.ai.t = d.ai; }
  else if (a === "ai-run") { aiRun([X.ai.t]); return; }
  else if (a === "ai-live") { liveAnalysis(X.ai.t); return; }
  else if (a === "ai-hold") { liveHold(X.ai.t); return; }
  else if (a === "ai-resume") { X.ai.model = selFromKey(v); liveAnalysis(X.ai.t); return; }
  else if (a === "ai-load") { loadAiRun(v); return; }
  else if (a === "lfc-run") { liveForecast(X.ptForm.t); return; }
  else if (a === "lfc-m") { const m = lfcModels(); m.has(v) ? m.delete(v) : m.add(v); }
  else if (a === "lfc-best") { X.lfc.models = new Set(LIVE.models.forecast.filter(x => x.default).map(x => x.key)); }
  else if (a === "lfc-all") { X.lfc.models = new Set(LIVE.models.forecast.map(x => x.key)); }
  else if (a === "ai-runall") { aiRun(AI_T.slice()); return; }
  else if (d.stage) X.ai.stage = d.stage;
  else if (d.bt) { X.bt.t = d.bt; X.bt.sel = new Set(["Ensemble"]); }
  else if (d.ds) { X.ds.t = d.ds; X.ds.page = 0; }
  else if (d.news) X.news.t = d.news;
  else if (d.home) X.home.t = d.home;
  else if (d.invT) X.inv.t = d.invT;
  else if (d.invSrc) X.inv.src = d.invSrc;
  else if (d.mem) X.mem.tab = d.mem;
  else if (d.setTheme) { settings.theme = d.setTheme; saveSettings(); applySettings(false); }
  else if (d.setView) { settings.view = d.setView; S.view = d.setView; saveSettings(); }
  else if (a === "wl-del") { X.wl = X.wl.filter(t => t !== v); lsSet("raem:wl", X.wl); X.wlMsg = ""; }
  else if (a === "wl-add") { if (!X.wl.includes(v)) X.wl.push(v); lsSet("raem:wl", X.wl); X.wlMsg = ""; }
  else if (a === "wl-reset") { X.wl = ORDER.slice(); lsDel("raem:wl"); X.wlMsg = ""; }
  else if (a === "pt-side") { X.ptForm.side = v; X.ptForm.msg = ""; }
  else if (a === "pt-go") placeOrder();
  else if (a === "pt-view") X.ptView = v;
  else if (a === "pt-reset") { X.pt = { cash: 100000, pos: {}, orders: [], realized: 0 }; lsDel("raem:pt"); X.ptForm.msg = "Account reset."; X.ptForm.ok = true; }
  else if (a === "bt-m") { X.bt.sel.has(v) ? X.bt.sel.delete(v) : X.bt.sel.add(v); }
  else if (a === "bt-t") { X.bt.t = v; X.bt.sel = new Set(["Ensemble"]); }
  else if (a === "fund-t") X.fund.t = v;
  else if (a === "more") S.more = !S.more;
  else if (a === "opt-toggle") S.optOpen = !S.optOpen;
  else if (a === "ds-clear") { X.ds.from = ""; X.ds.to = ""; X.ds.page = 0; }
  else if (a === "ds-prev") X.ds.page = Math.max(0, X.ds.page - 1);
  else if (a === "ds-next") X.ds.page++;
  else if (a === "set-reset") { Object.assign(settings, { theme: "system", win: 120, unit: "price", view: "Ensemble" }); lsDel("raem:set"); applySettings(true); }
  else return;
  render();
});
document.addEventListener("change", e => {
  const b = e.target.dataset.bind; if (!b) return;
  const v = e.target.value;
  if (b === "pt-t") { X.ptForm.t = v; X.ptForm.date = ""; X.ptForm.msg = ""; } else if (b === "pt-d") { X.ptForm.date = v; X.ptForm.msg = ""; } else if (b === "pt-q") { X.ptForm.qty = v; X.ptForm.msg = ""; }
  else if (b === "ds-from") { X.ds.from = v; X.ds.page = 0; } else if (b === "ds-to") { X.ds.to = v; X.ds.page = 0; }
  else if (b === "mem-t") X.mem.t = v;
  else if (b === "lfc-force") X.lfc.force = e.target.checked;
  else if (b === "ai-model") X.ai.model = v;
  else if (b === "ai-force") X.ai.force = e.target.checked;
  else if (b === "set-token") return;  // saved on input; a re-render here would swallow the click that caused the blur
  else if (b === "inv-basis") X.inv.basis = v;
  else if (b === "inv-amt") X.inv.amt = v;
  else if (b === "set-win") { settings.win = +v; S.win = +v; saveSettings(); }
  else if (b === "set-unit") { settings.unit = v; S.unit = v; saveSettings(); }
  else return;
  render();
});
document.addEventListener("input", e => {
  const b = e.target.dataset.bind;
  if (b === "pt-q") X.ptForm.qty = e.target.value;
  else if (b === "set-token") { LIVE.token = e.target.value.trim(); lsSet("raem:token", LIVE.token); }
  else if (b === "inv-amt") { X.inv.amt = e.target.value; render(); const i = $("#inv-a"); if (i) { i.focus(); try { i.setSelectionRange(i.value.length, i.value.length); } catch (err) { /* number inputs have no caret */ } } }
  else if (b === "mem-q") { X.mem.q = e.target.value; render(); const i = $("#mem-q"); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
});
document.addEventListener("submit", e => {
  if (e.target.id !== "wlform") return;
  e.preventDefault();
  const q = $("#wlq").value.trim().toUpperCase(); if (!q) return;
  const hit = ORDER.find(x => x === q);
  if (!hit) X.wlMsg = `${q} is not in this export. Available: ${ORDER.join(", ")}.`;
  else if (X.wl.includes(hit)) X.wlMsg = `${hit} is already on your watchlist.`;
  else { X.wl.push(hit); lsSet("raem:wl", X.wl); X.wlMsg = ""; }
  render();
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && S.more) { S.more = false; render(); return; }
  if (e.key === "Escape" && $("#app").classList.contains("open")) { $("#app").classList.remove("open"); $("#menu").setAttribute("aria-expanded", "false"); $("#menu").focus(); return; }
  const row =e.target.closest && e.target.closest("tr.click");
  if (row && e.target === row && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); row.click(); return; }
  const tab = e.target.closest && e.target.closest(".tab[role='tab']");
  if (tab && ["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) {
    e.preventDefault();
    const ids = TABS.map(t => t[0]), i = ids.indexOf(S.tab);
    S.tab = ids[e.key === "Home" ? 0 : e.key === "End" ? ids.length - 1 : (i + (e.key === "ArrowRight" ? 1 : -1) + ids.length) % ids.length];
    render(); const nt = $("#tab-" + S.tab); if (nt) nt.focus();
  }
});
$("#skip").addEventListener("click", e => { e.preventDefault(); $("#main").focus(); });
function markRows() { document.querySelectorAll("tr.click").forEach(r => { r.tabIndex = 0; }); }
document.addEventListener("click", e => { if (S.more && !e.target.closest(".morewrap")) { S.more = false; renderNav(); } });
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { const c = $("#chart"); if (c && S.page === "tk") drawChart(c); if (S.page === "bt") drawBT(); if (S.page === "paper") drawPT(); if (S.page === "inv") drawInv(); if (S.page === "dash") drawHome(); }, 120); });

$("#menu").innerHTML = ic("menu");
applySettings(true);
$("#savedAt").textContent = "Results saved " + dLong(ASOF);
function pageFromHash() {
  try {
    const h = decodeURIComponent(location.hash.slice(1));
    if (h.startsWith("tk-") && DATA[h.slice(3)]) { S.page = "tk"; S.t = h.slice(3); S.overlays = defaultOverlays(D()); return true; }
    if (h === "dash" || NAVS.some(n => n[0] === h)) { S.page = h; return true; }
  } catch (e) { /* ignore a bad link */ }
  return false;
}
addEventListener("hashchange", () => { if (!S.running && pageFromHash()) render(false); });
pageFromHash();
render(false);
liveInit();
</script>
